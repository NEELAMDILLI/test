<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Product Catalog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        #productCatalog {
            width: 600px;
            margin: 0 auto;
            text-align: left;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        #cart {
            width: 300px;
            margin: 0 auto;
            text-align: left;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        #checkoutBtn {
            padding: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="productCatalog">
        <h2>Product Catalog</h2>

        <div class="product" data-id="1" data-name="Laptop" data-price="800">
            <span>Laptop</span>
            <span>$800</span>
            <button onclick="addToCart(this)">Add to Cart</button>
        </div>

        <div class="product" data-id="2" data-name="Smartphone" data-price="400">
            <span>Smartphone</span>
            <span>$400</span>
            <button onclick="addToCart(this)">Add to Cart</button>
        </div>
    </div>

    <div id="cart">
        <h2>Shopping Cart</h2>
        <!-- Cart items will be dynamically added here -->
        <button id="checkoutBtn" onclick="checkout()">Checkout</button>
    </div>

    <script>
        function addToCart(button) {
            var product = button.parentNode;
            var productId = product.dataset.id;
            var productName = product.dataset.name;
            var productPrice = product.dataset.price;

            var cart = document.getElementById("cart");

            var cartItem = document.createElement("div");
            cartItem.className = "cart-item";
            cartItem.innerHTML = `
                <span>${productName}</span>
                <span>$${productPrice}</span>
                <button onclick="removeFromCart(this)">Remove</button>
            `;

            cart.appendChild(cartItem);
        }

        function removeFromCart(button) {
            var cartItem = button.parentNode;
            cartItem.parentNode.removeChild(cartItem);
        }

        function checkout() {
            var cartItems = document.querySelectorAll('.cart-item');
            var total = 0;

            cartItems.forEach(function (item) {
                var price = parseFloat(item.children[1].textContent.slice(1));
                total += price;
            });

            alert(`Total: $${total.toFixed(2)}`);
        }
    </script>
</body>
</html>
